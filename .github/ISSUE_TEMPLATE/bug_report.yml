name: "Сообщить об ошибке AIRUSS"
description: "Проблема сайта, загрузки или работы AIRUSS Browser"
title: "[Ошибка] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение! Не публикуйте пароли, токены, cookies, историю посещений или персональные данные. Уязвимости безопасности не описывайте публично: используйте приватный канал связи с командой.
  - type: dropdown
    id: area
    attributes:
      label: "Где возникла проблема?"
      options:
        - "Сайт AIRUSS / страница загрузки"
        - "Загрузка или установка"
        - "Интерфейс браузера"
        - "AI-чат / модели"
        - "Голос / микрофон"
        - "Скорость / зависание"
        - "Другое"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Что произошло?"
      description: "Кратко опишите проблему."
      placeholder: "Нажал кнопку, но ничего не произошло..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Как повторить ошибку?"
      description: "По шагам: 1. Открыл ... 2. Нажал ... 3. Увидел ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Как должно работать?"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Версия AIRUSS и Windows (если относится к браузеру)"
      placeholder: "AIRUSS 1.0, Windows 11"
  - type: textarea
    id: screenshot
    attributes:
      label: "Скриншот или текст ошибки (без личных данных)"
      description: "Можно перетащить изображение в поле."
  - type: dropdown
    id: severity
    attributes:
      label: "Насколько мешает?"
      options:
        - "Невозможно пользоваться"
        - "Функция не работает"
        - "Неудобство или визуальная ошибка"
    validations:
      required: true
