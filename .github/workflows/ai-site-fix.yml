name: AIRUSS — AI черновик исправления сайта
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Номер обращения GitHub Issue (только ошибки сайта)'
        required: true
        type: number
permissions:
  contents: read
  issues: write
  pull-requests: none
jobs:
  propose-site-fix:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Python syntax
        run: python -m py_compile scripts/ai_site_fix.py
      - name: Analyze approved issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: python scripts/ai_site_fix.py
